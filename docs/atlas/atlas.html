<meta charset="utf-8" />
<title>Exam Prep — Codebase Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap"
  rel="stylesheet"
/>

<style>
  :root {
    --bg: #f4f5f8;
    --bg2: #eaecf1;
    --panel: #ffffff;
    --panel2: #f7f8fa;
    --ink: #111827;
    --ink2: #4b5563;
    --ink3: #8a93a3;
    --line: #dfe3ea;
    --line2: #c9cfda;
    --grid: #d8dde6;
    --ground: #e6e9ef;
    --accent: #4f46e5;
    --accent-soft: #eef0ff;
    --shadow:
      0 1px 2px rgba(16, 24, 40, 0.06), 0 8px 24px rgba(16, 24, 40, 0.06);
    --face-top: 1.18;
    --face-r: 0.82;
    --face-l: 0.58;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
      --bg: #0b0e14;
      --bg2: #0f131b;
      --panel: #121722;
      --panel2: #0e131c;
      --ink: #e8ecf4;
      --ink2: #a3adc0;
      --ink3: #6b7688;
      --line: #232b3a;
      --line2: #2f3949;
      --grid: #1a2130;
      --ground: #111722;
      --accent: #818cf8;
      --accent-soft: #1b2136;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 28px rgba(0, 0, 0, 0.36);
      --face-top: 1.05;
      --face-r: 0.72;
      --face-l: 0.48;
    }
  }
  :root[data-theme='dark'] {
    --bg: #0b0e14;
    --bg2: #0f131b;
    --panel: #121722;
    --panel2: #0e131c;
    --ink: #e8ecf4;
    --ink2: #a3adc0;
    --ink3: #6b7688;
    --line: #232b3a;
    --line2: #2f3949;
    --grid: #1a2130;
    --ground: #111722;
    --accent: #818cf8;
    --accent-soft: #1b2136;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 28px rgba(0, 0, 0, 0.36);
    --face-top: 1.05;
    --face-r: 0.72;
    --face-l: 0.48;
  }

  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family:
      Inter,
      ui-sans-serif,
      system-ui,
      -apple-system,
      'Segoe UI',
      sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  .mono {
    font-family:
      'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  /* ---------- shell ---------- */
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
  }

  #topbar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: thin;
  }
  #brand {
    display: flex;
    flex-direction: column;
    gap: 1px;
    flex: 0 0 auto;
    padding-right: 14px;
    border-right: 1px solid var(--line);
  }
  #brand b {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: -0.01em;
    white-space: nowrap;
  }
  #brand span {
    font-size: 11px;
    color: var(--ink3);
    white-space: nowrap;
  }
  .stat {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1px;
    min-width: 0;
  }
  .stat .v {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.02em;
    font-family: 'JetBrains Mono', monospace;
  }
  .stat .k {
    font-size: 10px;
    color: var(--ink3);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    white-space: nowrap;
  }
  #themeBtn {
    margin-left: auto;
    flex: 0 0 auto;
    border: 1px solid var(--line2);
    background: var(--panel2);
    color: var(--ink2);
    border-radius: 8px;
    padding: 6px 10px;
    cursor: pointer;
    font: inherit;
    font-size: 12px;
  }
  #themeBtn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  #main {
    flex: 1 1 auto;
    display: flex;
    min-height: 0;
  }

  /* ---------- rails ---------- */
  #rail,
  #info {
    flex: 0 0 254px;
    background: var(--panel);
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-width: thin;
    scrollbar-color: var(--line2) transparent;
  }
  #rail {
    border-right: 1px solid var(--line);
  }
  #info {
    flex-basis: 320px;
    border-left: 1px solid var(--line);
  }
  .railGroup {
    padding: 10px 12px 4px;
  }
  .railGroup h4 {
    margin: 0 0 6px;
    font-size: 10px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--ink3);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .railGroup h4 i {
    width: 8px;
    height: 8px;
    border-radius: 2px;
    display: inline-block;
    flex: 0 0 auto;
  }
  .railItem {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 7px;
    border-radius: 7px;
    cursor: pointer;
    border: 1px solid transparent;
  }
  .railItem:hover {
    background: var(--panel2);
    border-color: var(--line);
  }
  .railItem.on {
    background: var(--accent-soft);
    border-color: var(--accent);
  }
  .railItem .code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    width: 22px;
    height: 18px;
    display: grid;
    place-items: center;
    border-radius: 4px;
    color: #fff;
    flex: 0 0 auto;
  }
  .railItem .nm {
    flex: 1 1 auto;
    font-size: 12.5px;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .railItem .lc {
    font-size: 10.5px;
    color: var(--ink3);
    font-family: 'JetBrains Mono', monospace;
    flex: 0 0 auto;
  }

  /* ---------- stage ---------- */
  #stage {
    flex: 1 1 auto;
    position: relative;
    background: radial-gradient(
      120% 90% at 50% 0%,
      var(--bg2) 0%,
      var(--bg) 70%
    );
    min-width: 0;
    overflow: hidden;
  }
  #svg {
    width: 100%;
    height: 100%;
    display: block;
    cursor: grab;
    touch-action: none;
  }
  #svg.drag {
    cursor: grabbing;
  }

  #hud {
    position: absolute;
    left: 12px;
    top: 12px;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    max-width: calc(100% - 24px);
  }
  .btn {
    border: 1px solid var(--line2);
    background: var(--panel);
    color: var(--ink2);
    border-radius: 8px;
    padding: 6px 11px;
    cursor: pointer;
    font: inherit;
    font-size: 12px;
    box-shadow: var(--shadow);
  }
  .btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .btn.primary:hover {
    filter: brightness(1.08);
    color: #fff;
  }
  .btn[disabled] {
    opacity: 0.45;
    cursor: not-allowed;
  }
  .btn[disabled]:hover {
    border-color: var(--line2);
    color: var(--ink2);
  }

  #legend {
    position: absolute;
    right: 12px;
    top: 12px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 11px;
    box-shadow: var(--shadow);
    font-size: 11px;
    color: var(--ink2);
    display: flex;
    flex-direction: column;
    gap: 5px;
    max-width: 190px;
  }
  #legend .row {
    display: flex;
    align-items: center;
    gap: 7px;
  }
  #legend i {
    width: 9px;
    height: 9px;
    border-radius: 2px;
    flex: 0 0 auto;
  }
  #legend .sep {
    height: 1px;
    background: var(--line);
    margin: 2px 0;
  }

  #tip {
    position: absolute;
    pointer-events: none;
    z-index: 40;
    background: var(--panel);
    border: 1px solid var(--line2);
    border-radius: 9px;
    padding: 8px 10px;
    box-shadow: var(--shadow);
    font-size: 12px;
    max-width: 280px;
    opacity: 0;
    transition: opacity 0.12s;
    color: var(--ink);
  }
  #tip b {
    display: block;
    font-size: 12.5px;
    margin-bottom: 2px;
  }
  #tip small {
    color: var(--ink3);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
  }

  /* ---------- trace ---------- */
  #trace {
    position: absolute;
    left: 12px;
    right: 12px;
    bottom: 12px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 10px 12px;
    display: none;
    gap: 10px;
    flex-direction: column;
  }
  #trace.on {
    display: flex;
  }
  #traceTop {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  #traceSel {
    border: 1px solid var(--line2);
    background: var(--panel2);
    color: var(--ink);
    font: inherit;
    font-size: 12px;
    border-radius: 8px;
    padding: 5px 8px;
    max-width: 100%;
  }
  #traceStep {
    flex: 1 1 260px;
    min-width: 200px;
    font-size: 13px;
    display: flex;
    gap: 9px;
    align-items: flex-start;
  }
  #traceStep .badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    color: #fff;
    padding: 3px 6px;
    border-radius: 5px;
    flex: 0 0 auto;
    margin-top: 1px;
  }
  #traceBar {
    display: flex;
    gap: 3px;
  }
  #traceBar span {
    flex: 1 1 0;
    height: 4px;
    border-radius: 2px;
    background: var(--line);
    transition: background 0.2s;
  }
  #traceBar span.done {
    background: var(--accent);
  }
  #traceBar span.now {
    background: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-soft);
  }

  /* ---------- info panel ---------- */
  #info .pad {
    padding: 14px 15px;
  }
  #infoHead {
    border-bottom: 1px solid var(--line);
  }
  #infoHead .eyebrow {
    font-size: 10px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--ink3);
  }
  #infoHead h2 {
    margin: 4px 0 8px;
    font-size: 18px;
    letter-spacing: -0.02em;
    line-height: 1.25;
  }
  #chips {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .chip {
    font-size: 10.5px;
    font-family: 'JetBrains Mono', monospace;
    padding: 3px 7px;
    border-radius: 5px;
    background: var(--panel2);
    border: 1px solid var(--line);
    color: var(--ink2);
  }
  .sect {
    border-bottom: 1px solid var(--line);
  }
  .sect h3 {
    margin: 0 0 7px;
    font-size: 10px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--ink3);
  }
  .sect p {
    margin: 0 0 9px;
    font-size: 13px;
    color: var(--ink2);
    line-height: 1.58;
  }
  .sect p:last-child {
    margin-bottom: 0;
  }
  .sect p strong {
    color: var(--ink);
    font-weight: 600;
  }
  .kidRow {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 4px 0;
    font-size: 12.5px;
    border-bottom: 1px dashed var(--line);
  }
  .kidRow:last-child {
    border-bottom: 0;
  }
  .kidRow .kn {
    flex: 1 1 auto;
    color: var(--ink2);
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .kidRow .kl {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink3);
    flex: 0 0 auto;
  }
  .linkRow {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .linkRow button {
    text-align: left;
    border: 1px solid var(--line);
    background: var(--panel2);
    color: var(--ink2);
    border-radius: 7px;
    padding: 6px 8px;
    cursor: pointer;
    font: inherit;
    font-size: 12px;
    line-height: 1.4;
  }
  .linkRow button:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .linkRow button .ar {
    color: var(--ink3);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
  }
  #note {
    padding: 11px 15px;
    font-size: 11.5px;
    color: var(--ink3);
    line-height: 1.55;
  }

  /* ---------- svg bits ---------- */
  .blk {
    cursor: pointer;
  }
  .blk .fc {
    transition: opacity 0.16s;
  }
  .blk:hover .fc {
    opacity: 0.86;
  }
  .lbl {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 11px;
    fill: #fff;
    pointer-events: none;
    text-anchor: middle;
    dominant-baseline: middle;
  }
  .nlbl {
    font-size: 11px;
    fill: var(--ink2);
    pointer-events: none;
    text-anchor: middle;
    font-weight: 500;
    paint-order: stroke;
    stroke: var(--bg);
    stroke-width: 3px;
    stroke-linejoin: round;
  }
  .edge {
    fill: none;
    stroke: var(--line2);
    stroke-width: 1.2;
    opacity: 0.55;
  }
  .edge.dash {
    stroke-dasharray: 4 4;
    opacity: 0.35;
  }
  .dot {
    pointer-events: auto;
    cursor: help;
  }
  .ext rect {
    fill: var(--panel);
    stroke: var(--line2);
    stroke-width: 1.1;
    stroke-dasharray: 3 3;
  }
  .ext text {
    font-size: 10px;
    fill: var(--ink2);
    text-anchor: middle;
    dominant-baseline: middle;
    font-weight: 500;
  }
  .lead {
    stroke: var(--line2);
    stroke-width: 1;
    stroke-dasharray: 2 3;
    fill: none;
    opacity: 0.6;
  }
  .dim {
    opacity: 0.16;
    transition: opacity 0.2s;
  }
  .hot .fc {
    opacity: 1;
  }
  .zoneLbl {
    font-size: 10px;
    fill: var(--ink3);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    text-anchor: middle;
    pointer-events: none;
    font-weight: 600;
    opacity: 0.7;
  }

  /* digits that line up in columns get fixed-width figures */
  .stat .v,
  .railItem .lc,
  .kidRow .kl,
  .chip {
    font-variant-numeric: tabular-nums;
  }

  /* keyboard focus must be visible everywhere it can land */
  .btn:focus-visible,
  #themeBtn:focus-visible,
  #traceSel:focus-visible,
  .railItem:focus-visible,
  .linkRow button:focus-visible,
  .blk:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 7px;
  }
  .railItem:focus-visible {
    background: var(--accent-soft);
  }

  @media (prefers-reduced-motion: reduce) {
    * {
      animation-duration: 0.001ms !important;
      transition-duration: 0.001ms !important;
    }
  }
  @media (max-width: 1180px) {
    #rail {
      display: none;
    }
  }
  @media (max-width: 900px) {
    #info {
      display: none;
    }
    #legend {
      display: none;
    }
  }
</style>

<div id="app">
  <div id="topbar">
    <div id="brand">
      <b>Exam Prep</b
      ><span>Turborepo · Bun · Next.js App Router · Postgres</span>
    </div>
    <div id="stats"></div>
    <button id="themeBtn" type="button">Theme</button>
  </div>
  <div id="main">
    <aside id="rail"></aside>
    <div id="stage">
      <svg id="svg"></svg>
      <div id="hud">
        <button class="btn primary" id="playBtn" type="button">
          ▶ Play trace
        </button>
        <button class="btn" id="backBtn" type="button" style="display: none">
          ← Back to city
        </button>
        <button class="btn" id="resetBtn" type="button">Reset view</button>
      </div>
      <div id="legend"></div>
      <div id="tip"></div>
      <div id="trace">
        <div id="traceTop">
          <select id="traceSel"></select>
          <div id="traceStep"></div>
          <button class="btn" id="prevBtn" type="button">←</button>
          <button class="btn" id="nextBtn" type="button">→</button>
          <button class="btn" id="stopBtn" type="button">✕</button>
        </div>
        <div id="traceBar"></div>
      </div>
    </div>
    <aside id="info"></aside>
  </div>
</div>

<script>
  'use strict'

  /* =======================================================================
     ALL NUMBERS BELOW COME FROM A SCAN OF THE REPOSITORY WORKING TREE.
     Line counts: `find <dir> -type f | xargs wc -l` for apps/ source, and
     `git ls-files <dir> | xargs wc -l` for infra/, .github/ and .claude/
     (tracked files only). Counts exclude node_modules, build output, and the
     git-ignored generated Prisma client.
     Measured on the `main` branch at commit cd97ea3, 2026-09-04.
     ======================================================================= */

  const GROUPS = [
    { id: 'ui', name: 'Browser surfaces', color: '#6366f1' },
    { id: 'features', name: 'Feature modules', color: '#8b5cf6' },
    { id: 'api', name: 'Route handlers', color: '#06b6d4' },
    { id: 'data', name: 'Data model', color: '#10b981' },
    { id: 'storage', name: 'Data stores', color: '#64748b' },
    { id: 'infra', name: 'Infrastructure', color: '#f97316' },
    { id: 'ci', name: 'Delivery pipeline', color: '#f43f5e' },
    { id: 'harness', name: 'Agent harness', color: '#14b8a6' }
  ]
  const GC = Object.fromEntries(GROUPS.map((g) => [g.id, g.color]))

  const STRUCTURES = [
    /* ---------------- browser surfaces ---------------- */
    {
      id: 'pages',
      code: 'PG',
      name: 'Pages & layouts',
      group: 'ui',
      loc: 1055,
      files: 10,
      gx: 2,
      gy: 0,
      w: 3,
      d: 2,
      what: 'The seven screens a learner actually sees: the dashboard listing every certification, a certification overview with its topics and weak spots, the drill screen itself, the run summary, the list of past runs, the bookmarked questions, and the launcher that turns a link into a live drill.',
      how: 'Next.js App Router with two route groups — one wraps pages in the normal shell, the other strips the shell away so the drill screen owns the whole viewport. Cache Components is off, so a page opts into dynamic rendering with a segment flag or by reading request data.',
      children: [
        { n: 'shell screens', l: 890 },
        { n: 'drill screen', l: 97 },
        { n: 'root layout', l: 49 },
        { n: 'global error boundary', l: 19 }
      ]
    },

    {
      id: 'components',
      code: 'CP',
      name: 'Component library',
      group: 'ui',
      loc: 1616,
      files: 23,
      gx: 6,
      gy: 0,
      w: 3,
      d: 2,
      what: 'The shared visual vocabulary every screen draws from — buttons, dialogs, menus, sheets, tooltips, the mastery bar, the sidebar, the bottom tab bar and the page shells. Anything used by more than one feature lives here.',
      how: 'Atomic design in four layers. Atoms never import molecules or organisms, and molecules only import atoms. Variants are built with class-variance-authority, and every root element carries a data-slot attribute so parents can style children by selector.',
      children: [
        { n: 'molecules', l: 612 },
        { n: 'organisms', l: 552 },
        { n: 'layout', l: 273 },
        { n: 'atoms', l: 179 }
      ]
    },

    {
      id: 'styles',
      code: 'ST',
      name: 'Design tokens',
      group: 'ui',
      loc: 438,
      files: 12,
      gx: 10,
      gy: 0,
      w: 2,
      d: 2,
      what: 'One place that decides what every colour, size, radius and motion in the product is. Nothing else hardcodes a hex value. It also holds the three verdict colours the drill depends on — one for right, one for shaky, one for wrong — plus the single accent reserved for the one action a screen most wants you to take.',
      how: 'A layer of CSS custom properties mapped into Tailwind through an inline theme block, split into files by concern: colour, type, spacing, motion and the browser-drawn surfaces most projects leave at their defaults.',
      children: [
        { n: 'colour', l: 155 },
        { n: 'elevation & shape', l: 68 },
        { n: 'layout & spacing', l: 58 },
        { n: 'browser surfaces', l: 56 },
        { n: 'typography', l: 50 },
        { n: 'motion', l: 37 },
        { n: 'entry files', l: 14 }
      ]
    },

    /* ---------------- feature modules ---------------- */
    {
      id: 'feat-drill',
      code: 'DR',
      name: 'Drill engine',
      group: 'features',
      loc: 3114,
      files: 41,
      gx: 4,
      gy: 3,
      w: 4,
      d: 3,
      what: 'The heart of the product, and by a wide margin the largest thing in it. It decides which questions you should see next, shows them one at a time, judges what you typed or picked, records the attempt, and moves the mastery of that question up or down as a result. It also runs the summary you land on when a run ends.',
      how: 'Split by execution context: server code builds and grades runs, client code owns the card, its keyboard shortcuts and its live announcements, a pure lib holds the queue ordering, the grader and the mastery transition, and schemas validate every request at the door. Failures come back as values rather than thrown exceptions.',
      children: [

    'The idea it is organised around is recall over recognition. A large share of the questions are fill-in rather than multiple choice — you type the answer from memory, and when the grader cannot decide whether what you typed counts, it says so and asks you to judge yourself rather than guessing on your behalf. That is closer to what a real exam demands than picking the least wrong of four options.',
    'Mastery is tracked per exam objective rather than per deck or per exam, which is what makes "drill my weak spots" a real button instead of a slogan. Two consecutive correct answers promote a question; one wrong answer sends it back. Nothing resets between sessions.',
    'There is deliberately no sign-in, no accounts and no authorisation layer anywhere in the city. That is a decision, not a gap — a personal tool that trusts its single user does not need the machinery, and the absence of it is why the front of the map is only eight small doors rather than a gate.'
  ].join(' ')

  const OVERVIEW_HOW = [
    'A Turborepo monorepo on Bun with a single application: a Next.js App Router app that is also the only server. Server components and route handlers reach the database and object storage directly — there is no separate backend service to forward to, and no browser code ever holds a credential for either.',
    'Two patterns recur. Failures are values rather than thrown exceptions: two small wrappers convert a throw into a result, and one wrapper around each route handler collects the error path at a single edge instead of repeating it at every call site. And every external input — a URL parameter, a request body, an environment variable, a question bank file — is validated against a schema at the boundary, never deeper in.',
    'Deployment is one configuration switched by environment rather than duplicated per environment, and destructive capability is kept out of it entirely: emptying storage and force-deleting secrets exist only in a manual, reviewer-gated teardown, so an ordinary apply is structurally unable to delete data. A build reaches all traffic at once — there is no canary and no automatic rollback, which is an accepted trade written down rather than an oversight.',
    'Two honest gaps. There is no test runner and no test file in this repository; verification comes from type checking, linting, security and quality scanning, and browser-level checks. And there is no alerting of any kind — nothing pages a human when the app errors.'
  ].join(' ')

  const STATS = [
    { v: '356', k: 'tracked files' },
    { v: '8,032', k: 'lines of TypeScript' },
    { v: '1,220', k: 'lines of infra config' },
    { v: '1,056', k: 'lines of pipeline' },
    { v: '9,445', k: 'lines of agent harness' },
    { v: '8', k: 'route operations' },
    { v: '7', k: 'page screens' },
    { v: '8', k: 'data models' },
    { v: '6', k: 'infra modules' },
    { v: '0', k: 'test files' }
  ]

  /* ===================== rendering ===================== */
  const NS = 'http://www.w3.org/2000/svg'
  const K = 1.22,
    U = 26,
    V = 14.3,
    HU = 36,
    HCAP = 2.0
  const SVG = document.getElementById('svg')
  const TIP = document.getElementById('tip')
  const STAGE = document.getElementById('stage')
  const byId = Object.fromEntries(STRUCTURES.map((s) => [s.id, s]))
  const extById = Object.fromEntries(EXTERNALS.map((e) => [e.id, e]))
  const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches

  const el = (n, a = {}) => {
    const e = document.createElementNS(NS, n)
    for (const k in a) e.setAttribute(k, a[k])
    return e
  }
  const esc = (s) =>
    String(s).replace(
      /[&<>"]/g,
      (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]
    )
  const fmt = (n) => n.toLocaleString('en-US')

  const hexAdj = (hex, f) => {
    const n = parseInt(hex.slice(1), 16)
    const cl = (v) => Math.max(0, Math.min(255, Math.round(v)))
    return (
      '#' +
      [cl(((n >> 16) & 255) * f), cl(((n >> 8) & 255) * f), cl((n & 255) * f)]
        .map((v) => v.toString(16).padStart(2, '0'))
        .join('')
    )
  }
  const cssNum = (name) =>
    parseFloat(
      getComputedStyle(document.documentElement).getPropertyValue(name)
    ) || 1

  const heightOf = (s) =>
    s.slab ? 0.14 : Math.min(HCAP, 0.35 * Math.sqrt(s.loc / 100))
  /* grid -> screen. Positions are spread by K; footprints are not. */
  const proj = (a, b, h = 0) => ({ x: (a - b) * U, y: (a + b) * V - h * HU })
  const originOf = (s) => ({ ax: s.gx * K, ay: s.gy * K })
  const footOf = (s) => {
    const { ax, ay } = originOf(s)
    return { ax, ay, bx: ax + s.w, by: ay + s.d }
  }
  const centerGrid = (s) => {
    const f = footOf(s)
    return { a: (f.ax + f.bx) / 2, b: (f.ay + f.by) / 2 }
  }
  const centerPt = (s) => {
    const c = centerGrid(s)
    return proj(c.a, c.b, heightOf(s))
  }
  const groundPt = (s) => {
    const c = centerGrid(s)
    return proj(c.a, c.b, 0)
  }
  const extCenter = (e) => proj(e.gx * K, e.gy * K, 0)

  /* --- layers: edges, then blocks, then dots (dots must sit above blocks) --- */
  let gRoot, gEdge, gExt, gBlock, gLabel, gDot, gZone
  let view = { x: 0, y: 0, k: 1 },
    drag = null,
    panSeq = 0
  let mode = 'city',
    insideId = null,
    selected = null

  const buildSvgSkeleton = () => {
    SVG.textContent = ''
    gRoot = el('g', { id: 'root' })
    gZone = el('g', { id: 'zones' })
    gEdge = el('g', { id: 'edges' })
    gExt = el('g', { id: 'externals' })
    gBlock = el('g', { id: 'blocks' })
    // captions ride above every block so a nearer tower can never clip them
    gLabel = el('g', { id: 'labels' })
    gDot = el('g', { id: 'dots' })
    gRoot.append(gZone, gEdge, gExt, gBlock, gLabel, gDot)
    SVG.append(gRoot)
  }

  const applyView = () =>
    gRoot.setAttribute(
      'transform',
      `translate(${view.x},${view.y}) scale(${view.k})`
    )

  /* ---- one block ---- */
  const drawBlock = (s, parentG, opts = {}) => {
    const color = opts.color || GC[s.group]
    const h = opts.h !== undefined ? opts.h : heightOf(s)
    const f = footOf(s)
    const fT = cssNum('--face-top'),
      fR = cssNum('--face-r'),
      fL = cssNum('--face-l')

    const g = el('g', { class: 'blk', 'data-id': s.id })

    const pt = (a, b, hh) => {
      const p = proj(a, b, hh)
      return `${p.x},${p.y}`
    }

    // right face  (plane gx = bx)
    g.append(
      el('polygon', {
        class: 'fc',
        points: [
          pt(f.bx, f.ay, h),
          pt(f.bx, f.by, h),
          pt(f.bx, f.by, 0),
          pt(f.bx, f.ay, 0)
        ].join(' '),
        fill: hexAdj(color, fR)
      })
    )
    // left face   (plane gy = by)
    g.append(
      el('polygon', {
        class: 'fc',
        points: [
          pt(f.ax, f.by, h),
          pt(f.bx, f.by, h),
          pt(f.bx, f.by, 0),
          pt(f.ax, f.by, 0)
        ].join(' '),
        fill: hexAdj(color, fL)
      })
    )
    // top face
    g.append(
      el('polygon', {
        class: 'fc',
        points: [
          pt(f.ax, f.ay, h),
          pt(f.bx, f.ay, h),
          pt(f.bx, f.by, h),
          pt(f.ax, f.by, h)
        ].join(' '),
        fill: hexAdj(color, fT),
        stroke: hexAdj(color, fT * 1.12),
        'stroke-width': 0.6
      })
    )

    const c = proj((f.ax + f.bx) / 2, (f.ay + f.by) / 2, h)
    const t = el('text', { class: 'lbl', x: c.x, y: c.y })
    t.textContent = s.code
    g.append(t)

    const base = proj((f.ax + f.bx) / 2, (f.ay + f.by) / 2, 0)
    const nl = el('text', {
      class: 'nlbl',
      'data-id': s.id,
      x: base.x,
      y: base.y + 13
    })
    nl.textContent = s.name
    ;(opts.labelLayer || gLabel).append(nl)

    g.addEventListener('mouseenter', (ev) => showTip(ev, s))
    g.addEventListener('mousemove', moveTip)
    g.addEventListener('mouseleave', hideTip)
    g.addEventListener('click', (ev) => {
      ev.stopPropagation()
      onPick(s.id)
    })
    parentG.append(g)
    return g
  }

  /* ---- externals ---- */
  const drawExternal = (e) => {
    const p = extCenter(e)
    const w = Math.max(96, e.name.length * 5.6 + 18),
      h = 26
    const g = el('g', { class: 'ext', 'data-id': e.id })
    g.append(
      el('rect', { x: p.x - w / 2, y: p.y - h / 2, width: w, height: h, rx: 7 })
    )
    const t = el('text', { x: p.x, y: p.y })
    t.textContent = e.name
    g.append(t)
    const a = byId[e.anchor]
    if (a) {
      const q = groundPt(a)
      gEdge.append(
        el('path', { class: 'lead', d: `M ${p.x} ${p.y} L ${q.x} ${q.y}` })
      )
    }
    g.addEventListener('mouseenter', (ev) =>
      showTip(ev, { name: e.name, ext: true })
    )
    g.addEventListener('mousemove', moveTip)
    g.addEventListener('mouseleave', hideTip)
    gExt.append(g)
  }

  /* ---- edges as L elbows in grid space ---- */
  const nodeGrid = (id) => {
    if (byId[id]) {
      const c = centerGrid(byId[id])
      return c
    }
    const e = extById[id]
    return e ? { a: e.gx * K, b: e.gy * K } : null
  }
  const edgePath = (ed) => {
    const A = nodeGrid(ed.f),
      B = nodeGrid(ed.t)
    if (!A || !B) return null
    const pts = [[A.a, A.b]]
    if (ed.via) ed.via.forEach((v) => pts.push([v[0] * K, v[1] * K]))
    else pts.push([B.a, A.b])
    pts.push([B.a, B.b])
    return pts
      .map(([a, b]) => proj(a, b, 0))
      .map((p, i) => `${i ? 'L' : 'M'} ${p.x} ${p.y}`)
      .join(' ')
  }

  const drawEdges = () => {
    EDGES.forEach((ed, i) => {
      const d = edgePath(ed)
      if (!d) return
      const p = el('path', {
        class: 'edge' + (ed.dashed ? ' dash' : ''),
        d,
        id: 'ep' + i,
        'data-f': ed.f,
        'data-t': ed.t
      })
      gEdge.append(p)
      if (ed.flow) {
        const col =
          GC[(byId[ed.t] || {}).group] ||
          GC[(byId[ed.f] || {}).group] ||
          '#94a3b8'
        const n = REDUCED ? 1 : 2
        for (let j = 0; j < n; j++) {
          const dot = el('circle', {
            class: 'dot',
            r: 2.6,
            fill: col,
            'data-f': ed.f,
            'data-t': ed.t
          })
          const title = `${ed.pay}`
          dot.addEventListener('mouseenter', (ev) =>
            showTip(ev, {
              name: labelOf(ed.f) + ' → ' + labelOf(ed.t),
              sub: title,
              ext: true
            })
          )
          dot.addEventListener('mousemove', moveTip)
          dot.addEventListener('mouseleave', hideTip)
          if (REDUCED) {
            const m = midOf(d)
            dot.setAttribute('cx', m.x)
            dot.setAttribute('cy', m.y)
          } else {
            const am = el('animateMotion', {
              dur: '3.4s',
              repeatCount: 'indefinite',
              begin: j * 1.7 + 's',
              rotate: '0'
            })
            am.append(el('mpath', { href: '#ep' + i }))
            dot.append(am)
          }
          gDot.append(dot)
        }
      }
    })
  }
  const labelOf = (id) => (byId[id] || extById[id] || { name: id }).name
  const midOf = (d) => {
    const nums = d.match(/-?\d+(\.\d+)?/g).map(Number)
    const n = nums.length
    return { x: nums[n - 2], y: nums[n - 1] }
  }

  /* ---- zone captions ---- */
  /* Captions sit in the empty margin beside each cluster, never over a block. */
  const ZONES = [
    { t: 'browser', at: [0, -4] },
    { t: 'features', at: [-3, 5] },
    { t: 'route handlers', at: [-3, 10] },
    { t: 'data', at: [1, 13.5] },
    { t: 'stores', at: [16, 11] },
    { t: 'infrastructure', at: [23, 11] },
    { t: 'delivery', at: [24, 3] },
    { t: 'harness', at: [14, 18] }
  ]
  const drawZones = () => {
    ZONES.forEach((z) => {
      const p = proj(z.at[0] * K, z.at[1] * K, 0)
      const t = el('text', { class: 'zoneLbl', x: p.x, y: p.y })
      t.textContent = z.t
      gZone.append(t)
    })
  }

  /* ---- city ---- */
  const renderCity = () => {
    mode = 'city'
    insideId = null
    buildSvgSkeleton()
    drawZones()
    drawEdges()
    EXTERNALS.forEach(drawExternal)
    ;[...STRUCTURES]
      .sort((a, b) => a.gx + a.gy - (b.gx + b.gy))
      .forEach((s) => drawBlock(s, gBlock))
    applyView()
    document.getElementById('backBtn').style.display = 'none'
  }

  /* ---- inside view ---- */
  const renderInside = (id) => {
    const s = byId[id]
    if (!s || !s.children) return
    mode = 'inside'
    insideId = id
    buildSvgSkeleton()
    // largest first, so the number on each block is its rank by size
    const kids = [...s.children].sort(
      (a, b) =>
        (typeof b.l === 'number' ? b.l : 0) -
        (typeof a.l === 'number' ? a.l : 0)
    )
    const nums = kids.map((k) => (typeof k.l === 'number' ? k.l : 0))
    const max = Math.max(1, ...nums)
    const cols = Math.min(3, Math.ceil(Math.sqrt(kids.length)))
    const fake = kids.map((k, i) => ({
      id: 'kid' + i,
      code: String(i + 1).padStart(2, '0'),
      name: k.n,
      group: s.group,
      loc: typeof k.l === 'number' ? k.l : 0,
      files: 0,
      gx: (i % cols) * 4,
      gy: Math.floor(i / cols) * 4,
      w: 3,
      d: 3,
      _label: typeof k.l === 'number' ? fmt(k.l) + ' lines' : String(k.l)
    }))
    ;[...fake]
      .sort((a, b) => a.gx + a.gy - (b.gx + b.gy))
      .forEach((f) => {
        const h =
          typeof kids[fake.indexOf(f)].l === 'number'
            ? 0.25 + 1.5 * (f.loc / max)
            : 0.4
        const g = drawBlock(f, gBlock, { h })
        const base = proj(f.gx * K + f.w / 2, f.gy * K + f.d / 2, 0)
        const kfoot = proj(f.gx * K + f.w, f.gy * K + f.d, 0)
        const sub = el('text', { class: 'nlbl', x: base.x, y: kfoot.y + 26 })
        sub.textContent = f._label
        sub.style.opacity = '.75'
        g.append(sub)
        g.addEventListener('click', (ev) => ev.stopPropagation())
      })
    // caption goes in the label layer and above the tallest block, so nothing covers it
    const top = gBlock.getBBox()
    const t = el('text', {
      class: 'zoneLbl',
      x: top.x + top.width / 2,
      y: top.y - 26
    })
    t.textContent = 'inside · ' + s.name
    gLabel.append(t)
    applyView()
    fitToContent(true)
    infoFor(id)
    document.getElementById('backBtn').style.display = ''
  }

  /* ---- tooltip ---- */
  const showTip = (ev, s) => {
    const sub = s.ext
      ? s.sub || ''
      : s.slab
        ? s.metric || ''
        : `${fmt(s.loc)} lines · ${s.files} files`
    TIP.innerHTML = `<b>${esc(s.name)}</b>${sub ? `<small>${esc(sub)}</small>` : ''}`
    TIP.style.opacity = '1'
    moveTip(ev)
  }
  const moveTip = (ev) => {
    const r = STAGE.getBoundingClientRect()
    let x = ev.clientX - r.left + 14,
      y = ev.clientY - r.top + 14
    const tw = TIP.offsetWidth,
      th = TIP.offsetHeight
    if (x + tw > r.width - 8) x = ev.clientX - r.left - tw - 14
    if (y + th > r.height - 8) y = ev.clientY - r.top - th - 14
    TIP.style.left = x + 'px'
    TIP.style.top = y + 'px'
  }
  const hideTip = () => {
    TIP.style.opacity = '0'
  }

  /* ---- highlight ---- */
  const highlight = (id) => {
    selected = id
    const near = new Set([id])
    EDGES.forEach((e) => {
      if (e.f === id) near.add(e.t)
      if (e.t === id) near.add(e.f)
    })
    gBlock.querySelectorAll('.blk').forEach((g) => {
      const on = !id || near.has(g.dataset.id)
      g.classList.toggle('dim', !!id && !on)
      g.classList.toggle('hot', !!id && g.dataset.id === id)
    })
    gLabel.querySelectorAll('.nlbl').forEach((t) => {
      t.classList.toggle('dim', !!id && !near.has(t.dataset.id))
    })
    gExt.querySelectorAll('.ext').forEach((g) => {
      g.classList.toggle('dim', !!id && !near.has(g.dataset.id))
    })
    gEdge.querySelectorAll('.edge').forEach((p) => {
      const on = !id || p.dataset.f === id || p.dataset.t === id
      p.classList.toggle('dim', !!id && !on)
    })
    gDot.querySelectorAll('.dot').forEach((p) => {
      const on = !id || p.dataset.f === id || p.dataset.t === id
      p.classList.toggle('dim', !!id && !on)
    })
    document
      .querySelectorAll('.railItem')
      .forEach((r) => r.classList.toggle('on', r.dataset.id === id))
  }

  /* ---- info panel ---- */
  const infoOverview = () => {
    document.getElementById('info').innerHTML = `
      <div class="pad sect" id="infoHead">
        <div class="eyebrow">Codebase atlas</div>
        <h2>Exam Prep</h2>
        <div id="chips">
          <span class="chip">Turborepo</span><span class="chip">Bun</span>
          <span class="chip">Next.js App Router</span><span class="chip">Prisma</span>
          <span class="chip">Postgres</span><span class="chip">Terraform</span>
        </div>
      </div>
      <div class="pad sect"><h3>What it does</h3><p>${esc(OVERVIEW_WHAT)}</p></div>
      <div class="pad sect"><h3>How it's built</h3><p>${esc(OVERVIEW_HOW)}</p></div>
      <div id="note">Every line count and file count on this page was measured by scanning the working tree, not estimated. Click any block to read what it does; click again on a block with a breakdown to go inside it.</div>`
  }

  const infoFor = (id) => {
    const s = byId[id]
    if (!s) return infoOverview()
    const gname = (GROUPS.find((g) => g.id === s.group) || {}).name || ''
    const size = s.slab
      ? `<span class="chip">${esc(s.metric || '')}</span>`
      : `<span class="chip">${fmt(s.loc)} lines</span><span class="chip">${s.files} files</span>`
    const kids = [...(s.children || [])]
      // same order as the go-inside view, so the ranks agree
      .sort(
        (a, b) =>
          (typeof b.l === 'number' ? b.l : 0) -
          (typeof a.l === 'number' ? a.l : 0)
      )
      .map((k) => {
        const v = typeof k.l === 'number' ? fmt(k.l) + ' lines' : k.l
        return `<div class="kidRow"><span class="kn">${esc(k.n)}</span><span class="kl">${esc(v)}</span></div>`
      })
      .join('')
    const ins = EDGES.filter((e) => e.t === id),
      outs = EDGES.filter((e) => e.f === id)
    const linkBtns = (arr) =>
      arr
        .map((e) => {
          const other = e.f === id ? e.t : e.f,
            dir = e.f === id ? '→' : '←'
          return `<button data-goto="${esc(other)}"><span class="ar">${dir}</span> ${esc(labelOf(other))}<br><span class="ar">${esc(e.pay)}</span></button>`
        })
        .join('')

    document.getElementById('info').innerHTML = `
      <div class="pad sect" id="infoHead">
        <div class="eyebrow">${esc(gname)}</div>
        <h2>${esc(s.name)}</h2>
        <div id="chips"><span class="chip">${esc(s.code)}</span>${size}</div>
      </div>
      <div class="pad sect"><h3>What it does</h3><p>${esc(s.what)}</p></div>
      <div class="pad sect"><h3>How it's built</h3><p>${esc(s.how)}</p></div>
      ${
        kids
          ? `<div class="pad sect"><h3>Breakdown</h3>${kids}
        <div style="margin-top:9px"><button class="btn" data-inside="${esc(id)}">Go inside →</button></div></div>`
          : ''
      }
      ${outs.length ? `<div class="pad sect"><h3>Sends to</h3><div class="linkRow">${linkBtns(outs)}</div></div>` : ''}
      ${ins.length ? `<div class="pad sect"><h3>Receives from</h3><div class="linkRow">${linkBtns(ins)}</div></div>` : ''}
      <div id="note">Counts measured from the working tree.</div>`

    document
      .querySelectorAll('[data-goto]')
      .forEach((b) => b.addEventListener('click', () => onPick(b.dataset.goto)))
    const ib = document.querySelector('[data-inside]')
    if (ib) ib.addEventListener('click', () => renderInside(id))
  }

  const onPick = (id) => {
    if (mode === 'inside') return
    if (extById[id]) {
      highlight(id)
      return
    }
    if (!byId[id]) return
    highlight(id)
    infoFor(id)
    panTo(id)
  }

  /* ---- rail ---- */
  const buildRail = () => {
    const r = document.getElementById('rail')
    r.innerHTML = GROUPS.map((g) => {
      const items = STRUCTURES.filter((s) => s.group === g.id)
      if (!items.length) return ''
      return `<div class="railGroup"><h4><i style="background:${g.color}"></i>${esc(g.name)}</h4>${items
        .map(
          (
            s
          ) => `<div class="railItem" data-id="${esc(s.id)}" tabindex="0" role="button">
          <span class="code" style="background:${g.color}">${esc(s.code)}</span>
          <span class="nm">${esc(s.name)}</span>
          <span class="lc">${s.slab ? '—' : fmt(s.loc)}</span></div>`
        )
        .join('')}</div>`
    }).join('')
    r.querySelectorAll('.railItem').forEach((i) => {
      const go = () => {
        if (mode === 'inside') renderCity()
        onPick(i.dataset.id)
      }
      i.addEventListener('click', go)
      i.addEventListener('keydown', (ev) => {
        if (ev.key === 'Enter' || ev.key === ' ') {
          ev.preventDefault()
          go()
        }
      })
    })
  }

  const buildStats = () => {
    document.getElementById('stats').innerHTML =
      `<div style="display:flex;gap:18px">` +
      STATS.map(
        (s) =>
          `<div class="stat"><span class="v">${esc(s.v)}</span><span class="k">${esc(s.k)}</span></div>`
      ).join('') +
      `</div>`
  }

  const buildLegend = () => {
    document.getElementById('legend').innerHTML =
      GROUPS.map(
        (g) =>
          `<div class="row"><i style="background:${g.color}"></i>${esc(g.name)}</div>`
      ).join('') +
      `<div class="sep"></div>
       <div class="row"><i style="background:var(--ink3);border-radius:50%"></i>moving dot = live data</div>
       <div class="row"><i style="background:transparent;border:1px dashed var(--line2)"></i>dashed = build-time link</div>
       <div class="row" style="color:var(--ink3)">height ∝ √lines of code</div>`
  }

  /* ---- pan / zoom ---- */
  const fitToContent = (instant) => {
    const bb = gRoot.getBBox()
    const r = SVG.getBoundingClientRect()
    const pad = 34
    const k = Math.min(
      (r.width - pad * 2) / bb.width,
      (r.height - pad * 2 - 30) / bb.height,
      1.6
    )
    view.k = k
    view.x = r.width / 2 - (bb.x + bb.width / 2) * k
    view.y = (r.height - 40) / 2 - (bb.y + bb.height / 2) * k
    applyView()
  }

  const panTo = (id) => {
    const s = byId[id]
    if (!s) return
    const p = centerPt(s)
    const r = SVG.getBoundingClientRect()
    const tx = r.width / 2 - p.x * view.k,
      ty = (r.height - 90) / 2 - p.y * view.k
    animatePan(tx, ty)
  }

  const animatePan = (tx, ty) => {
    const seq = ++panSeq
    if (REDUCED) {
      view.x = tx
      view.y = ty
      applyView()
      return
    }
    const sx = view.x,
      sy = view.y,
      t0 = performance.now(),
      dur = 420
    const step = (now) => {
      if (seq !== panSeq) return // a newer pan took over
      const t = Math.min(1, (now - t0) / dur),
        e = 1 - Math.pow(1 - t, 3)
      view.x = sx + (tx - sx) * e
      view.y = sy + (ty - sy) * e
      applyView()
      if (t < 1) requestAnimationFrame(step)
    }
    requestAnimationFrame(step)
  }

  SVG.addEventListener('pointerdown', (ev) => {
    drag = { x: ev.clientX, y: ev.clientY, vx: view.x, vy: view.y }
    panSeq++
    SVG.classList.add('drag')
    SVG.setPointerCapture(ev.pointerId)
  })
  SVG.addEventListener('pointermove', (ev) => {
    if (!drag) return
    view.x = drag.vx + (ev.clientX - drag.x)
    view.y = drag.vy + (ev.clientY - drag.y)
    applyView()
  })
  const endDrag = (ev) => {
    drag = null
    SVG.classList.remove('drag')
  }
  SVG.addEventListener('pointerup', endDrag)
  SVG.addEventListener('pointercancel', endDrag)
  SVG.addEventListener(
    'wheel',
    (ev) => {
      ev.preventDefault()
      panSeq++
      const r = SVG.getBoundingClientRect()
      const mx = ev.clientX - r.left,
        my = ev.clientY - r.top
      const f = Math.exp(-ev.deltaY * 0.0014)
      const nk = Math.max(0.25, Math.min(4, view.k * f))
      view.x = mx - (mx - view.x) * (nk / view.k)
      view.y = my - (my - view.y) * (nk / view.k)
      view.k = nk
      applyView()
    },
    { passive: false }
  )
  SVG.addEventListener('click', () => {
    if (mode === 'city') {
      highlight(null)
      infoOverview()
    }
  })

  /* ---- traces ---- */
  let tIdx = 0,
    tStep = -1
  const traceEl = document.getElementById('trace')
  const traceSel = document.getElementById('traceSel')
  const traceStepEl = document.getElementById('traceStep')
  const traceBar = document.getElementById('traceBar')

  const buildTraceUI = () => {
    traceSel.innerHTML = TRACES.map(
      (t, i) => `<option value="${i}">${esc(t.name)}</option>`
    ).join('')
    traceSel.addEventListener('change', () => {
      tIdx = +traceSel.value
      tStep = -1
      nextStep()
    })
    document.getElementById('nextBtn').addEventListener('click', nextStep)
    document.getElementById('prevBtn').addEventListener('click', prevStep)
    document.getElementById('stopBtn').addEventListener('click', stopTrace)
  }
  const renderBar = () => {
    const n = TRACES[tIdx].steps.length
    traceBar.innerHTML = Array.from(
      { length: n },
      (_, i) =>
        `<span class="${i < tStep ? 'done' : i === tStep ? 'now' : ''}"></span>`
    ).join('')
  }
  const showStep = () => {
    const t = TRACES[tIdx],
      st = t.steps[tStep]
    if (!st) return
    const [sid, txt] = st
    const node = byId[sid] || extById[sid] || { name: sid }
    const col = byId[sid] ? GC[byId[sid].group] : '#64748b'
    traceStepEl.innerHTML = `<span class="badge" style="background:${col}">${tStep + 1}/${t.steps.length}</span>
       <span><strong>${esc(node.name)}</strong> — ${esc(txt)}</span>`
    renderBar()
    if (byId[sid]) {
      highlight(sid)
      infoFor(sid)
      panTo(sid)
    } else {
      highlight(sid)
    }
    document.getElementById('prevBtn').disabled = tStep <= 0
    document.getElementById('nextBtn').disabled = tStep >= t.steps.length - 1
  }
  const nextStep = () => {
    if (mode === 'inside') renderCity()
    traceEl.classList.add('on')
    const t = TRACES[tIdx]
    tStep = Math.min(t.steps.length - 1, tStep + 1)
    showStep()
  }
  const prevStep = () => {
    tStep = Math.max(0, tStep - 1)
    showStep()
  }
  const stopTrace = () => {
    traceEl.classList.remove('on')
    tStep = -1
    highlight(null)
    infoOverview()
  }

  document.getElementById('playBtn').addEventListener('click', () => {
    if (mode === 'inside') renderCity()
    traceEl.classList.add('on')
    tStep = -1
    nextStep()
  })
  document.getElementById('backBtn').addEventListener('click', () => {
    renderCity()
    fitToContent()
    if (selected) highlight(selected)
  })
  document.getElementById('resetBtn').addEventListener('click', () => {
    if (mode === 'inside') renderCity()
    highlight(null)
    infoOverview()
    fitToContent()
  })

  /* ---- theme ---- */
  const applyTheme = (v) => {
    if (v === 'system') document.documentElement.removeAttribute('data-theme')
    else document.documentElement.setAttribute('data-theme', v)
    try {
      localStorage.setItem('atlas-theme', v)
    } catch (e) {}
    const inside = insideId
    if (mode === 'inside' && inside) renderInside(inside)
    else renderCity()
    if (selected) highlight(selected)
  }
  document.getElementById('themeBtn').addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme') || 'system'
    applyTheme(cur === 'system' ? 'dark' : cur === 'dark' ? 'light' : 'system')
  })
  try {
    const saved = localStorage.getItem('atlas-theme')
    if (saved && saved !== 'system')
      document.documentElement.setAttribute('data-theme', saved)
  } catch (e) {}

  /* ---- keyboard ---- */
  addEventListener('keydown', (ev) => {
    if (ev.key === 'ArrowRight' && traceEl.classList.contains('on')) nextStep()
    if (ev.key === 'ArrowLeft' && traceEl.classList.contains('on')) prevStep()
    if (ev.key === 'Escape') {
      if (mode === 'inside') {
        renderCity()
        fitToContent()
      } else stopTrace()
    }
  })

  /* ---- boot ---- */
  buildStats()
  buildRail()
  buildLegend()
  buildTraceUI()
  renderCity()
  infoOverview()
  fitToContent()
  addEventListener('resize', () => {
    if (mode === 'city') fitToContent()
  })

  /* expose for headless verification */
  window.__atlas = {
    STRUCTURES,
    EDGES,
    TRACES,
    EXTERNALS,
    get mode() {
      return mode
    },
    get insideId() {
      return insideId
    },
    get step() {
      return tStep
    },
    get traceIdx() {
      return tIdx
    },
    pick: onPick,
    inside: renderInside,
    city: renderCity,
    next: nextStep,
    prev: prevStep,
    play: () => document.getElementById('playBtn').click(),
    stop: stopTrace,
    setTrace: (i) => {
      tIdx = i
      traceSel.value = String(i)
      tStep = -1
      nextStep()
    },
    theme: applyTheme,
    footOf,
    heightOf
  }
</script>
