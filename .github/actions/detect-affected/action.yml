name: 'Detect Affected Apps'
description: 'Determine which apps are affected by the pushed commits, following the workspace dependency graph'

inputs:
  event-name:
    description: 'github.event_name — "push" enables affected-detection; anything else deploys both apps'
    required: true
  ref-type:
    description: 'github.ref_type — a tag push has no usable diff base, so it deploys both apps without running detection'
    required: true
  scope:
    description: 'workflow_dispatch scope — infra-and-apps | infra-only | apps-only. Empty on push events (treated as infra-and-apps).'
    required: false
    default: ''
  before-sha:
    description: 'github.event.before — the commit the branch pointed at before the push'
    required: false
    default: ''
  head-sha:
    description: 'github.sha — the commit being deployed'
    required: true

outputs:
  backend:
    description: 'Whether the backend app should be deployed ("true"/"false")'
    value: ${{ steps.affected.outputs.backend }}
  frontend:
    description: 'Whether the frontend app should be deployed ("true"/"false")'
    value: ${{ steps.affected.outputs.frontend }}
  infra:
    description: 'Whether infra/** changed in this push ("true"/"false") — gates the apply-dev job'
    value: ${{ steps.affected.outputs.infra }}

runs:
  using: 'composite'
  steps:
    - name: Setup Bun
      if: inputs.event-name == 'push' && inputs.ref-type == 'branch'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: 1.3.14

    - name: Install dependencies
      if: inputs.event-name == 'push' && inputs.ref-type == 'branch'
      shell: bash
      run: bun install --frozen-lockfile

    - name: Determine affected apps
      id: affected
      shell: bash
      env:
        EVENT_NAME: ${{ inputs.event-name }}
        REF_TYPE: ${{ inputs.ref-type }}
        SCOPE: ${{ inputs.scope }}
        BEFORE_SHA: ${{ inputs.before-sha }}
        HEAD_SHA: ${{ inputs.head-sha }}
      run: |
        chmod +x .github/scripts/detect-affected.sh
        .github/scripts/detect-affected.sh
