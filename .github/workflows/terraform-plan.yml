name: Terraform Plan

on:
  pull_request:
    branches:
      - main
    paths:
      - 'infra/**'
      - '.github/workflows/terraform-plan.yml'
      - '.github/actions/terraform-plan-comment/**'
      - '.github/scripts/terraform-plan-comment.sh'

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: terraform-plan-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      TF_IN_AUTOMATION: 'true'
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_VAR_project_name: ${{ github.event.repository.name }}
      TF_VAR_environment: prod
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_root_domain: ${{ vars.TF_VAR_root_domain }}
      TF_VAR_database_url: ${{ secrets.TF_VAR_database_url }}
      TF_VAR_dns_account_role_arn: ${{ vars.DNS_ACCOUNT_ROLE_ARN }}
      TF_VAR_github_org: ${{ github.repository_owner }}
      TF_VAR_github_access_token: ${{ secrets.TF_VAR_github_access_token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '~> 1.14'

      - name: Configure AWS credentials (plan role)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.TF_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: TerraformPlan

      - name: Terraform fmt check
        run: terraform -chdir=infra fmt -check -recursive

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: v0.63.1

      - name: Init TFLint
        run: tflint --chdir=infra --init
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run TFLint
        run: tflint --chdir=infra --recursive --format compact --minimum-failure-severity=error

      - name: Terraform init
        run: terraform -chdir=infra init -backend-config=backends/prod.hcl

      - name: Terraform validate
        run: terraform -chdir=infra validate

      - name: Terraform plan
        id: plan
        run: |
          set +e
          terraform -chdir=infra plan \
            -no-color \
            -lock=false \
            2>&1 | tee /tmp/plan-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          set -e
          [ "$EXIT_CODE" -ne 1 ]

      - name: Post or update PR comment
        if: always()
        uses: ./.github/actions/terraform-plan-comment
        with:
          plan-file: /tmp/plan-output.txt
          environment: prod
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ github.event.pull_request.number }}
