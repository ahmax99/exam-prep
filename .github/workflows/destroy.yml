name: Destroy Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to destroy'
        type: choice
        options:
          - dev
          - prod
        required: true
      confirm:
        description: 'Type "destroy <environment>" exactly, e.g. destroy dev'
        type: string
        required: true

permissions:
  contents: read

jobs:
  preflight:
    name: Confirm teardown of ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check the confirmation phrase
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          CONFIRM: ${{ inputs.confirm }}
          PROJECT_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          expected="destroy ${ENVIRONMENT}"
          if [ "$CONFIRM" != "$expected" ]; then
            echo "::error::confirm must be exactly \"${expected}\""
            exit 1
          fi
          echo "::warning::ECR images are shared by dev and prod — this purges ${PROJECT_NAME}-backend and ${PROJECT_NAME}-frontend for BOTH environments. Prod re-deploys will fail until the next build."
          echo "Confirmed teardown of ${ENVIRONMENT}."

  destroy:
    name: Destroy ${{ inputs.environment }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: ${{ inputs.environment }}
    concurrency:
      group: terraform-state-${{ inputs.environment }}
      cancel-in-progress: false

    permissions:
      id-token: write
      contents: read

    env:
      TF_IN_AUTOMATION: 'true'
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_VAR_project_name: ${{ github.event.repository.name }}
      TF_VAR_environment: ${{ inputs.environment }}
      TF_VAR_maintenance_mode: ${{ vars.MAINTENANCE_MODE || 'false' }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_root_domain: ${{ vars.TF_VAR_root_domain }}
      TF_VAR_contact_to_email: ${{ vars.TF_VAR_contact_to_email }}
      TF_VAR_from_email: ${{ vars.TF_VAR_from_email }}
      TF_VAR_database_url: ${{ secrets.TF_VAR_database_url }}
      TF_VAR_google_client_id: ${{ secrets.TF_VAR_google_client_id }}
      TF_VAR_google_client_secret: ${{ secrets.TF_VAR_google_client_secret }}
      TF_VAR_resend_api_key: ${{ secrets.TF_VAR_resend_api_key }}
      TF_VAR_session_secret: ${{ secrets.TF_VAR_session_secret }}
      TF_VAR_backend_sentry_dsn: ${{ secrets.TF_VAR_backend_sentry_dsn }}
      TF_VAR_frontend_sentry_dsn: ${{ secrets.TF_VAR_frontend_sentry_dsn }}
      TF_VAR_central_ecr_account_id: ${{ vars.CENTRAL_ECR_ACCOUNT_ID }}
      TF_VAR_dns_account_role_arn: ${{ vars.DNS_ACCOUNT_ROLE_ARN }}
      TF_VAR_github_org: ${{ github.repository_owner }}
      TF_VAR_github_org_id: ${{ github.repository_owner_id }}
      TF_VAR_github_repo_id: ${{ github.repository_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '~> 1.14'
          terraform_wrapper: false

      - name: Configure AWS credentials (apply role)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.TF_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: TerraformDestroy

      - name: Terraform init
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: terraform -chdir=infra init -backend-config="backends/${ENVIRONMENT}.hcl"

      - name: Disable Cognito deletion protection
        env:
          PROJECT_NAME: ${{ github.event.repository.name }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          chmod +x .github/scripts/destroy-cognito-unprotect.sh
          .github/scripts/destroy-cognito-unprotect.sh

      - name: Empty the S3 buckets
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          chmod +x .github/scripts/destroy-purge-buckets.sh
          .github/scripts/destroy-purge-buckets.sh

      - name: Terraform destroy
        run: |
          chmod +x .github/scripts/terraform-destroy-retry.sh
          .github/scripts/terraform-destroy-retry.sh

      - name: Force-delete the database secret
        env:
          PROJECT_NAME: ${{ github.event.repository.name }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          chmod +x .github/scripts/destroy-force-delete-secret.sh
          .github/scripts/destroy-force-delete-secret.sh

      - name: Assert the state is empty
        run: |
          set -euo pipefail
          if ! remaining=$(terraform -chdir=infra state list); then
            echo "::error::Could not read Terraform state, so destruction is unverified. Re-dispatch to retry."
            exit 1
          fi
          if [ -n "$remaining" ]; then
            echo "::error::terraform destroy reported success but these resources remain in state:"
            echo "$remaining"
            exit 1
          fi
          echo "State is empty — every managed resource is destroyed."

  db-reset:
    name: Reset the ${{ inputs.environment }} database
    needs: destroy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Ensure psql is available
        run: command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }

      - name: Drop every table
        env:
          DATABASE_URL: ${{ secrets.TF_VAR_database_url }}
        run: |
          chmod +x .github/scripts/destroy-reset-database.sh
          .github/scripts/destroy-reset-database.sh

  ecr-purge:
    name: Purge the shared ECR images
    needs: destroy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    concurrency:
      group: ecr-shared-registry
      cancel-in-progress: false

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Configure AWS credentials (ECR purge role)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.ECR_PURGE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: EcrPurge

      - name: Purge the images
        env:
          PROJECT_NAME: ${{ github.event.repository.name }}
          REGISTRY_ID: ${{ vars.CENTRAL_ECR_ACCOUNT_ID }}
        run: |
          chmod +x .github/scripts/destroy-purge-ecr.sh
          .github/scripts/destroy-purge-ecr.sh
