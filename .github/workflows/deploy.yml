name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'infra/**'
      - '.github/workflows/deploy.yml'
      - '.github/actions/**'
      - '.github/scripts/**'
  workflow_dispatch: {}

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_IN_AUTOMATION: 'true'
  TF_VAR_project_name: ${{ github.event.repository.name }}
  TF_VAR_environment: prod
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}
  TF_VAR_root_domain: ${{ vars.TF_VAR_root_domain }}
  TF_VAR_github_org: ${{ github.repository_owner }}
  TF_VAR_dns_account_role_arn: ${{ vars.DNS_ACCOUNT_ROLE_ARN }}

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  detect:
    name: Detect infra changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      infra: ${{ steps.changes.outputs.infra }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect infra changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != 'push' ]; then
            infra=true
          elif ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            echo "::notice::Base commit '${BEFORE_SHA}' unavailable — applying."
            infra=true
          else
            changed="$(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA")"
            if grep -qE '^\.github/(workflows/deploy\.yml|actions/|scripts/)' <<<"$changed"; then
              echo "::notice::Pipeline definition changed — applying."
              infra=true
            else
              grep -qE '^infra/' <<<"$changed" && infra=true || infra=false
            fi
          fi
          echo "infra=${infra}"
          echo "infra=${infra}" >> "$GITHUB_OUTPUT"

  apply:
    name: Terraform Apply → Prod
    needs: detect
    if: needs.detect.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: prod
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: terraform-state-prod
      cancel-in-progress: false
    env:
      TF_VAR_database_url: ${{ secrets.TF_VAR_database_url }}
      TF_VAR_github_access_token: ${{ secrets.TF_VAR_github_access_token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '~> 1.14'
          terraform_wrapper: false

      - name: Configure AWS credentials (apply role)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.TF_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: TerraformApplyProd

      - name: Apply (prod)
        uses: ./.github/actions/terraform-apply-env
        with:
          environment: prod
