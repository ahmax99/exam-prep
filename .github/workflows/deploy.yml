name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'apps/nextjs/**'
      - 'infra/**'
      - 'package.json'
      - 'bun.lock'
      - 'turbo.json'
      - '.github/workflows/deploy.yml'
      - '.github/actions/**'
      - '.github/scripts/**'
  workflow_dispatch:
    inputs:
      scope:
        description: 'What to run. infra-only = Terraform apply only. app-only = migrate + Vercel deploy only (re-deploy main).'
        type: choice
        options:
          - infra-and-app
          - infra-only
          - app-only
        default: infra-and-app
        required: true

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_IN_AUTOMATION: 'true'
  TF_VAR_project_name: ${{ github.event.repository.name }}
  TF_VAR_environment: prod
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}
  TF_VAR_root_domain: ${{ vars.TF_VAR_root_domain }}
  TF_VAR_dns_account_role_arn: ${{ vars.DNS_ACCOUNT_ROLE_ARN }}
  TF_VAR_vercel_team: ${{ vars.VERCEL_TEAM }}

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  detect:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      infra: ${{ steps.changes.outputs.infra }}
      app: ${{ steps.changes.outputs.app }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCOPE: ${{ inputs.scope }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != 'push' ]; then
            [ "$SCOPE" != 'app-only' ] && infra=true || infra=false
            [ "$SCOPE" != 'infra-only' ] && app=true || app=false
          elif ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            echo "::notice::Base commit '${BEFORE_SHA}' unavailable — running everything."
            infra=true
            app=true
          else
            changed="$(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA")"
            if grep -qE '^\.github/(workflows/deploy\.yml|actions/|scripts/)' <<<"$changed"; then
              echo "::notice::Pipeline definition changed — running everything."
              infra=true
              app=true
            else
              grep -qE '^infra/' <<<"$changed" && infra=true || infra=false
              grep -qE '^(apps/nextjs/|package\.json$|bun\.lock$|turbo\.json$)' <<<"$changed" && app=true || app=false
            fi
          fi
          echo "infra=${infra} app=${app}"
          {
            echo "infra=${infra}"
            echo "app=${app}"
          } >> "$GITHUB_OUTPUT"

  # ── Ordering gate — Terraform apply, before any app deploy ──────────────────
  apply:
    name: Terraform Apply → Prod
    needs: detect
    if: needs.detect.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: prod
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: terraform-state-prod
      cancel-in-progress: false
    env:
      TF_VAR_database_url: ${{ secrets.TF_VAR_database_url }}
      VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '~> 1.14'
          terraform_wrapper: false

      - name: Configure AWS credentials (apply role)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.TF_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: TerraformApplyProd

      - name: Apply (prod)
        uses: ./.github/actions/terraform-apply-env
        with:
          environment: prod

  # ── App deploy — migrate the database, then build and promote on Vercel ─────
  deploy-app:
    name: Deploy App → Prod
    needs: [detect, apply]
    if: |
      !cancelled() &&
      needs.detect.outputs.app == 'true' &&
      (needs.apply.result == 'success' || needs.apply.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: prod
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
    concurrency:
      group: vercel-deploy-prod
      cancel-in-progress: false
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
      VERCEL_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Before the deploy, so the schema always lands ahead of the code that expects it.
      - name: Deploy pending migrations
        run: bunx --bun turbo run db:deploy --filter=nextjs
        env:
          DATABASE_URL: ${{ secrets.TF_VAR_database_url }}

      - name: Link Vercel project
        env:
          VERCEL_TEAM: ${{ vars.VERCEL_TEAM }}
          VERCEL_PROJECT: ${{ github.event.repository.name }}
        run: bunx vercel@60.1.3 link --yes --team "$VERCEL_TEAM" --project "$VERCEL_PROJECT"

      # Vercel builds remotely: the sensitive DATABASE_URL can't be pulled for a local build.
      - name: Deploy to Vercel (production)
        id: deploy
        run: |
          set -euo pipefail
          url="$(bunx vercel@60.1.3 deploy --prod --yes)"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
